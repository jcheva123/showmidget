<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Selfies · Show Midget</title>
<link rel="stylesheet" href="/racing.css">
<link rel="stylesheet" href="/participacion.css?v=1">
  <meta name="theme-color" content="#0D0E10">

<link rel="stylesheet" href="/navigation.css?v=1">

<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
</head>
<body class="sm-has-navigation participation-page"><header class="brandbar"><a class="wordmark" href="/" aria-label="Show Midget inicio">SHOW<span>MIDGET<span class="brand-dot">.</span></span></a><img src="/logocmslow.png" width="88" height="51" alt="Club Midgistas del Sur"></header>
  <main class="app-shell"><section class="page-heading"><h1>SELFIES<br><em>A PANTALLA.</em></h1></section>


    <div class="card">
      <div class="camera-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v13H3Z"/><circle cx="12" cy="13" r="4"/></svg></div>

      <input type="file" accept="image/*" capture="user" id="fileInput"/>
      <button class="action" onclick="document.getElementById('fileInput').click()">Abrir cámara</button>

      <img id="preview" alt="Vista previa"/>
      <button class="action" onclick="enviar()">Enviar selfie</button>
      <div id="estado" role="status" aria-live="polite"></div>
    </div>

    <footer class="club-footer"><p><strong>Club Midgistas del Sur</strong></p><a href="/info.html">Redes y contacto ↗</a></footer>
  </main>

  <!-- Formulario oculto para Apps Script -->
  <form id="formulario" method="POST" target="invisibleFrame"
        action="https://script.google.com/macros/s/AKfycbxYP3sljeWslfTu9fy7LBuBJ8_n-ZXnIayvKo90Jqik3D_LEOLwl6c0qksm5mY3rRnY-w/exec">
    <input type="hidden" name="imageData" id="imageDataInput"/>
  </form>
  <iframe name="invisibleFrame" style="display:none"></iframe>

<script>
  const fileInput = document.getElementById('fileInput');
  const preview   = document.getElementById('preview');
  const estado    = document.getElementById('estado');
  const form      = document.getElementById('formulario');
  const imageDataInput = document.getElementById('imageDataInput');
  let imagenBase64 = "";

  fileInput.addEventListener('change', function(){
    const file = this.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      imagenBase64 = e.target.result;
      preview.src = imagenBase64;
      preview.style.display = 'block';
      estado.textContent = '';
    };
    reader.readAsDataURL(file);
  });

  function enviar(){
    if(!imagenBase64){
      estado.textContent='⚠️ Primero seleccioná una imagen.';
      return;
    }
    imageDataInput.value = imagenBase64;
    estado.textContent='⏳ Enviando...';
    form.submit();
    setTimeout(()=>{
      estado.textContent='✅ Selfie enviada correctamente.';
      estado.className='mensaje-exito';
      preview.style.display='none';
      fileInput.value='';
      imagenBase64='';
    }, 2000);
  }
</script>

</body>
</html>
