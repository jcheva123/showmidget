<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0D0E10" />
  <title>Posiciones · Show Midget</title>

  <link rel="stylesheet" href="/racing.css" />
  <link rel="stylesheet" href="/posiciones/appearance.css?v=1" />
<link rel="stylesheet" href="/navigation.css?v=1">

<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
</head>
<body class="sm-has-navigation">



  <header class="brandbar"><a class="wordmark" href="/" aria-label="Show Midget inicio">SHOW<span>MIDGET<span class="brand-dot">.</span></span></a><img src="/logocmslow.png" width="88" height="51" alt="Club Midgistas del Sur"></header>

  <main class="app-shell"><section class="page-heading"><div class="eyebrow">RANKING FINAL</div><h1>POSICIONES<br><em>CAMPEONATO.</em></h1></section>
    <section id="results">
      

      <div class="meta-row">
        <span id="meta" aria-live="polite"></span>
      </div>

      <div class="table-container">
        <table id="tbl">
          <thead>
            <tr>
              <th data-k="pos" title="Posición en el ranking">POS.</th>
              <th data-k="nro" title="Número actual del piloto">N°</th>
              <th data-k="varDiff" title="Variación hacia el número de la próxima temporada">VAR.</th>
              <th data-k="nombre" class="th-left">PILOTO</th>
              <th data-k="total">PTS.</th>
            </tr>
          </thead>
          <tbody><!-- filas dinámicas --></tbody>
        </table>
        <div id="skeleton" class="skeleton" hidden>
          <div class="row"></div><div class="row"></div><div class="row"></div><div class="row"></div>
        </div>
      </div>
<div class="results-toolbar">
        <input id="results-search" type="search" placeholder="Buscar piloto por nombre o número" aria-label="Buscar piloto" inputmode="search" autocomplete="off" />
      </div>
    </section>
  </main>

  <div id="creditos">
    <a href="http://www.primate.com.ar" target="_blank">by PRIMATE ®</a>
  </div>

  <script src="posiciones.v2.js"></script>
